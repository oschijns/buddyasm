
[config]

# Target hardware
system = "famicom"

# Background or Foreground tileset
kind = "bg"

# Bitplane layout
bit_plane = "bpp2"

# Default palette to use for processing the spritework
default_palette = "palette.png"

# Where to output the processed tileset
output = "output"




[[entry]]

# Optional name for the entry
name = "mercredi"

# Load a sprite work
image = "mercredi.png"

# Use a custom palette
palette = "palette.png"

# Should we output the index data in JSON format
# Only applicable for static and animated spritework entries
output_json = true

# Which template file to use for rendering
template = "template.asm"


[[entry]]

# Load a font file
image = "font.png"
palette = "font-palette.png"

# Pick all printable ASCII characters and place them at the expected location for ASCII characters
fixed_mapping = [{ start = 0x20, end = 0x21, target = 0x00 }]


[[entry]]

# Load a font file
image = "font.png"
palette = "font-palette.png"

# Pick all printable ASCII characters and place them at the expected location for ASCII characters
fixed_mapping = [{ start = 0x21, end = 0x2F, target = 0x21 }]


[[entry]]

# Load a font file
image = "font.png"
palette = "font-palette.png"

# Pick all printable ASCII characters and place them at the expected location for ASCII characters
fixed_mapping = [{ start = 0x41, end = 0x5A, target = 0x41 }]
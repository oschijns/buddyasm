
[config]

# Target hardware
system = "pc-engine"

# Background or Foreground tileset
kind = "fg"

# Default palette to use for processing the spritework
default_palette = "palette.png"

# Where to output the processed tileset
output = "../../../output/pce"


# Templating configuration
[templating]

# Optional directory of templates to include
includes = "templates"

# Override prefixes
prefix_bin = "0b"
prefix_oct = "0o"
prefix_hex = "0x"

# Override delimiters
delimiter_block    = ["{%", "%}"]
delimiter_variable = ["{{", "}}"]
delimiter_comment  = ["{#", "#}"]


# List of entries to process

[[entry]]

# Load a font file
image = "font_vincent.png"

# Pick all printable ASCII characters and place them at the expected location for ASCII characters
fixed_mapping = [ { start = 0x0, end = 0x20, target = 0x0 } ]

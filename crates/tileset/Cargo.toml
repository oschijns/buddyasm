[package]
name = "buddyasm_tileset"
description = "Read images and convert them into optimized tilesets for retro consoles"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true


[features]
default = ["binary"]

# dependencies enabled when building the binary
binary = ["dep:clap"]

[[bin]]
name = "main"
required-features = ["binary"]


[dependencies]

buddyasm_common = { path = "../common" }

# Report errors when loading images
thiserror.workspace = true

# Serialize & deserialize data
serde.workspace = true
serde_json = "1.0"

# Map enums with strings
strum = { version = "0.28", features = ["derive"] }

# Process matrix data
ndarray = { version = "0.17", features = ["rayon", "serde"] }
itertools = "0.15"

# Serialize the data into a contiguous sequence
bytes = "1.11"
bitfield = "0.19"
bitvec = "1.0"
bytemuck = "1.25"

# Load regular image formats
image = { version = "0.25", features = ["bmp", "png"] }

# Load Aseprite file
aseprite-loader = "0.4"
ouroboros = "0.18"
regex = "1.13"

# Load Tiled file
tiled = "0.16"

# Generate source files from data processed
minijinja = { version = "2.24", features = ["custom_syntax"] }

# Command-line arguments
clap = { version = "4.6", features = ["derive"], optional = true }

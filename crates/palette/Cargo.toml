[package]
name = "buddyasm_palette"
description = "Convert a RGB palette into the corresponding palette for the target system"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true


[features]
default = ["binary"]

# dependencies enabled when building the binary
binary = ["dep:clap"]

[[bin]]
name = "main"
required-features = ["binary"]


[dependencies]

buddyasm_common = { path = "../common" }

# Report errors when loading images
thiserror.workspace = true

# Serialize & deserialize data
serde.workspace = true
serde_json = "1.0"

# Allow reformatting text so that it fits the target text box
textwrap = "0.16"
ndarray = { version = "0.17", features = ["rayon", "serde"] }
itertools = "0.15"



# Command-line arguments
clap = { version = "4.6", features = ["derive"], optional = true }

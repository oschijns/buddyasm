[package]
name = "buddyasm_common"
description = "Common components when building binaries"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
color-space = ["dep:image", "dep:regex"]
image = ["dep:image", "dep:regex", "image?/default"]

[dependencies]

# Report errors when loading images
thiserror.workspace = true

# Serialize & deserialize data
serde.workspace = true

# Read TOML manifest file
toml = "1.1"

# Handle errors
anyhow = "1.0"

# Access RGB and RGBA types
image = {
    version = "0.25",
    default-features = false,
    optional = true,
}

# Parse a string to extract a color value
regex = { version = "1.13", optional = true }

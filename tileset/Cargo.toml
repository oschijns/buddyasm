[package]
name = "buddyasm_tileset"
description = "Read images and convert them into optimized tilesets for retro consoles"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Report errors when loading images
thiserror.workspace = true

# Serialize & deserialize data
serde.workspace = true

# Process matrix data
ndarray = { version = "0.17", features = ["rayon"] }
itertools = "0.14"

# Serialize the data into a contiguous sequence
bitfield = "0.19"
bitvec = "1.0"

# Load regular image formats
image = { version = "0.25", features = ["bmp", "png"] }

# Load Aseprite file
asefile = "0.3"
